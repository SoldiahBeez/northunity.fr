
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capthaine Gandjahman | North Unity</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    .back {
      display: inline-block;
      color: #e32c14;
      text-decoration: none;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .back:hover {
      color: #f5c542;
    }

    h1 {
      text-align: center;
      color: #f5c542;
      font-size: 2.2rem;
      margin: 10px 0 35px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .artist-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: start;
    }

    .artist-photo {
      width: 100%;
      display: block;
      border-radius: 8px;
      object-fit: contain;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 35px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .socials a {
      display: inline-block;
      padding: 12px 18px;
      background: #222;
      border: 1px solid #e32c14;
      border-radius: 5px;
      color: #eee;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .socials a:hover {
      background: #e32c14;
      color: #fff;
    }

    .section-title {
      color: #f5c542;
      font-size: 1.3rem;
      margin: 0 0 15px;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .artist-content {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.7rem;
      }

      .container {
        width: 92%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <a class="back" href="../index.html#artistes">
      ← Retour aux artistes
    </a>

    <h1>Capthaine Gandjahman</h1>

    <div class="artist-content">

      <div>
        <!-- Vérifie que le nom du fichier photo correspond -->
        <img
          class="artist-photo"
          src="../images/capthaine.jpg"
          alt="Capthaine Gandjahman sur scène"
        >
      </div>

      <div>
        <h2 class="section-title">Vidéo</h2>

        <div class="video-container">
          <iframe
            src="https://www.youtube.com/embed/hTx-T7OZdGI"
            title="Capthaine Gandjahman - vidéo"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

        <div class="socials">
          <a
            href="https://www.facebook.com/capthaine.g"
            target="_blank"
            rel="noopener noreferrer">
            Facebook
          </a>

          <a
            href="https://www.instagram.com/capthaine/"
            target="_blank"
            rel="noopener noreferrer">
            Instagram
          </a>

          <a
            href="https://www.youtube.com/@TheNayans"
            target="_blank"
            rel="noopener noreferrer">
            YouTube
          </a>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
