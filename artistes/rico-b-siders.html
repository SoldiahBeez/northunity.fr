<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rico B Siders — North Unity Webradio</title>
<style>
:root{--bg:#090a09;--card:#171a17;--cream:#eee9dc;--muted:#aaa99f;--gold:#d3a83d;--red:#a91518}
*{box-sizing:border-box}body{margin:0;background:
radial-gradient(circle at 20% 0%,rgba(169,21,24,.18),transparent 32%),
radial-gradient(circle at 85% 20%,rgba(105,125,69,.16),transparent 30%),var(--bg);
color:var(--cream);font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1000px,calc(100% - 30px));margin:auto}
header{padding:28px 0}
.back{display:inline-block;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;text-decoration:none;margin-bottom:25px}
.brand{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;color:#aaa}
main{padding:25px 0 80px}
.grid{display:grid;grid-template-columns:minmax(250px,380px) 1fr;gap:42px;align-items:start}
.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid rgba(255,255,255,.13);border-radius:6px;box-shadow:0 20px 55px rgba(0,0,0,.5)}
.kicker{color:var(--gold);text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:bold}
h1{font-size:clamp(2.5rem,7vw,5.5rem);line-height:.9;margin:8px 0 22px;text-transform:uppercase;letter-spacing:-.05em}
p{color:var(--muted);line-height:1.7}
.media{margin-top:28px;padding:20px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:6px}
.media a{display:inline-block;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.15);padding:10px 14px;margin:5px 5px 0 0;font-size:.8rem;text-transform:uppercase}
@media(max-width:700px){.grid{grid-template-columns:1fr;gap:25px}}

.media-block{margin:0 0 22px}
.media-title{color:#d3a83d;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:700;margin-bottom:9px}
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:5px;overflow:hidden}
.video iframe,.special-player{width:100%;height:100%;border:0;display:block}
.audio-player{width:100%;height:352px;border:0;border-radius:6px;background:#111}
.special-player{height:352px;background:#111;border-radius:6px}
.empty{padding:25px;color:#aaa;background:#111;border:1px solid rgba(255,255,255,.1);border-radius:6px}
</style>
</head>
<body>
<header><div class="wrap">
<a class="back" href="../index.html#artistes">← Retour aux artistes</a>
<div class="brand">North Unity Webradio</div>
</div></header>
<main><div class="wrap">
<div class="grid">
<div><img class="cover" src="https://i.ibb.co/PhCcfyz/Rico.jpg" alt="Rico B Siders"></div>
<div>
<div class="kicker">Artiste / Selecta / Sound</div>
<h1>Rico B Siders</h1>
<p>Retrouve Rico B Siders dans l'univers de North Unity Webradio — Roots, Reggae, Dancehall & Dub.</p>
<div class="media">
<div class="media-block">
  <div class="media-title">Vidéo</div>
  <div class="video"><iframe src="https://www.youtube.com/embed/JRGIR5vYVf4" title="Rico B Siders — vidéo YouTube" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
</div></div>
</div>
</div>
</div></main>
</body>
</html>
